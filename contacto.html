<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>InfoTech News - Contacto</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800">
  <header class="bg-blue-900 text-white p-4">
    <div class="container mx-auto flex justify-between items-center">
      <h1 class="text-2xl font-bold">InfoTech News</h1>
      <nav class="space-x-4">
        <a href="index.html" class="hover:underline">Inicio</a>
        <a href="contacto.html" class="hover:underline font-semibold">Contacto</a>
      </nav>
    </div>
  </header>

  <main class="container mx-auto max-w-lg my-10 p-6 bg-white rounded-lg shadow-md">
    <h2 class="text-2xl font-bold mb-4">Contacto</h2>
    <form id="contactForm" class="space-y-4">
      <div>
        <label class="block font-semibold">Nombre completo:</label>
        <input type="text" id="nombre" class="w-full border p-2 rounded" required>
      </div>
      <div>
        <label class="block font-semibold">Correo electrónico:</label>
        <input type="email" id="correo" class="w-full border p-2 rounded" required>
      </div>
      <div>
        <label class="block font-semibold">Mensaje:</label>
        <textarea id="mensaje" class="w-full border p-2 rounded" rows="4" required></textarea>
      </div>
      <button type="submit" class="bg-blue-800 text-white px-4 py-2 rounded font-bold w-full">Enviar</button>
    </form>
    <div id="confirmacion" class="hidden mt-4 p-3 bg-green-100 text-green-700 rounded text-center font-semibold">
      ¡Mensaje enviado con éxito!
    </div>
  </main>

  <script>
    document.getElementById('contactForm').addEventListener('submit', function(e) {
      e.preventDefault();
      document.getElementById('confirmacion').classList.remove('hidden');
      this.reset();
    });
  </script>
</body>
</html>
